# ---------------------------------------------------------------------------
# Kairos Local — Docker Compose (single-user, self-hosted, local-only)
#
#   docker compose up -d --build
#   open http://127.0.0.1:3000
#
# No Supabase. No accounts. No cloud. One workspace, one user, on your machine.
# Data lives in the `kairos-db` volume and survives rebuilds.
#
# Bound to 127.0.0.1 by default so it is never reachable from your LAN.
# Change KAIROS_BIND_HOST only if you understand the trade-off (see README).
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: kairos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${KAIROS_DB_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    volumes:
      - kairos-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  kairos:
    build:
      context: .
      # NEXT_PUBLIC_* are inlined at build time. In local mode they are
      # intentionally empty — the gate is disabled at runtime instead.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ""
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
        NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
    image: kairos-local:latest
    container_name: kairos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KAIROS_BIND_HOST:-127.0.0.1}:${KAIROS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgresql://kairos:${KAIROS_DB_PASSWORD:-kairos}@db:5432/kairos"
      DIRECT_URL: "postgresql://kairos:${KAIROS_DB_PASSWORD:-kairos}@db:5432/kairos"
      PORT: "3000"
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
      # The whole point of this mode:
      KAIROS_AUTH_DISABLED: "true"
      KAIROS_ALLOWED_EMAILS: ""
      KAIROS_NO_INDEX: "true"
    stop_grace_period: 15s

volumes:
  kairos-db:
    name: kairos-db