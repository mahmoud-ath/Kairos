# ---------------------------------------------------------------------------
# Kairos — Docker Compose (self-hosted / local use)
#
#   cp .env.example .env      # adjust the published port if needed
#   docker compose up -d --build
#
# The app is published on 127.0.0.1 by default. Supabase Auth is the only access
# control, and the gate fails closed: with no NEXT_PUBLIC_SUPABASE_URL the app
# refuses to serve requests. Those two values are inlined at BUILD time, so put
# them in .env and rebuild — or set KAIROS_AUTH_DISABLED=true to run without
# sign-in, and keep the port on 127.0.0.1 if you do, because every visitor then
# shares one workspace.
#
# Data lives in PostgreSQL, not in the image. On Vercel you point DATABASE_URL
# and DIRECT_URL at Supabase instead of this `db` service (see DEPLOYMENT.md).
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: kairos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${KAIROS_DB_PASSWORD:-kairos}
      POSTGRES_DB: kairos
    volumes:
      - kairos-db:/var/lib/postgresql/data
      # Creates the throw-away database the Playwright suite uses.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the app container needs to reach PostgreSQL.
    expose:
      - "5432"

  kairos:
    build:
      context: .
    image: kairos:latest
    container_name: kairos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KAIROS_BIND_HOST:-127.0.0.1}:${KAIROS_PORT:-3000}:3000"
    environment:
      # The database lives in the `db` service, never inside the image.
      DATABASE_URL: "postgresql://kairos:${KAIROS_DB_PASSWORD:-kairos}@db:5432/kairos"
      DIRECT_URL: "postgresql://kairos:${KAIROS_DB_PASSWORD:-kairos}@db:5432/kairos"
      PORT: "3000"
      NODE_ENV: production
      # Runtime knob: "true" runs this stack without sign-in. The NEXT_PUBLIC_*
      # pair cannot be passed here — it is inlined into the build.
      KAIROS_AUTH_DISABLED: "${KAIROS_AUTH_DISABLED:-false}"
    stop_grace_period: 15s

volumes:
  kairos-db:
    name: kairos-db
